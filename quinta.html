<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva do Prato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }

    header {
      background: #222;
      padding: 20px;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 60px; /* Aumentada ligeiramente */
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input[type="text"],
    input[type="date"],
    button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #444;
    }

    #prato {
      display: none;
      margin-top: 30px;
    }

    img.prato-img {
      width: 300px;
      border-radius: 10px;
    }

    .footer-text {
      margin-top: 50px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="https://www.tudopararegistar.pt/TRSOFT.png?v=84vxjc8z7408oxt" alt="Logo TR soft">
    </div>
  </header>

  <div class="container">
    <h2>Reserva do Prato nº4</h2>

    <div class="formulario">
      <label for="nome">O teu nome:</label>
      <input type="text" id="nome" required>

      <label for="dia">Data em que queres consumir:</label>
      <input type="date" id="dia" required>

      <button id="btnVer" onclick="submeter()">Ver Prato</button>
      <button onclick="cancelar()">Cancelar</button>

      <div class="footer-text">tr rest</div>
    </div>

    <div id="prato">
      <h3>🥩 Entrecosto</h3>
      <img class="prato-img" src="https://www.receitasnestle.pt/sites/default/files/styles/recipe_full_image/public/2019-06/entrecosto.jpg?itok=KDFqmw9p" alt="Entrecosto">
    </div>
  </div>

  <script>
    function submeter() {
      const nome = document.getElementById('nome').value.trim();
      const dia = document.getElementById('dia').value;
      const prato = "4";
      const botao = document.getElementById("btnVer");

      if (!nome || !dia) {
        alert("Preenche todos os campos!");
        return;
      }

      // Impede múltiplos envios
      botao.disabled = true;
      botao.textContent = "A enviar...";

      const formData = new FormData();
      formData.append("nome", nome);
      formData.append("prato", prato);
      formData.append("dia", dia);

      fetch("https://script.google.com/macros/s/AKfycbwRZUTv4-2vWc1PrHFVTbbphJMdMNHXuJ5TFFbICw9LUDIinUbhXkziv6dTiPXhCf5d/exec", {
        method: "POST",
        body: formData
      })
      .then(response => response.text())
      .then(data => {
        if (data === "OK") {
          document.querySelector(".formulario").style.display = "none";
          document.getElementById("prato").style.display = "block";
        } else {
          alert("Erro ao enviar. Tenta novamente.");
          botao.disabled = false;
          botao.textContent = "Ver Prato";
        }
      })
      .catch(error => {
        alert("Erro ao enviar. Verifica a ligação.");
        console.error(error);
        botao.disabled = false;
        botao.textContent = "Ver Prato";
      });
    }

    function cancelar() {
      document.getElementById("nome").value = "";
      document.getElementById("dia").value = "";
    }
  </script>

</body>
</html>
